version: '3.9'

services:
  # ─── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: taxai_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: taxai
      MONGO_INITDB_ROOT_PASSWORD: taxai_secret
      MONGO_INITDB_DATABASE: taxai
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - taxai_network

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: taxai_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - taxai_network

  # ─── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    container_name: taxai_api
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://taxai:taxai_secret@mongodb:27017/taxai?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health/live']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - taxai_network

  # ─── Worker ────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: development
    container_name: taxai_worker
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://taxai:taxai_secret@mongodb:27017/taxai?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taxai_network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  taxai_network:
    driver: bridge